name: Archive read trace tests
on:
  push:
    paths:
      - src/core/file_sys/archive_read_trace.h
      - src/core/libraries/kernel/file_system.cpp
      - tests/test_archive_read_trace.cpp
      - .github/workflows/archive-read-trace-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic bounds and concurrency tests
        run: |
          g++ -std=c++20 -g -pthread -fsanitize=address,undefined -Isrc tests/test_archive_read_trace.cpp -o trace-test
          ./trace-test
